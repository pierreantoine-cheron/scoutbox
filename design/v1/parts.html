<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScoutBox · Éléments</title>
  <style>
    :root {
      --bg:      oklch(98.5% 0.002 240);
      --surface: oklch(100% 0 0);
      --fg:      oklch(20% 0.014 250);
      --muted:   oklch(52% 0.012 250);
      --border:  oklch(91% 0.006 250);
      --accent:  oklch(46% 0.13 145);

      --accent-soft:  color-mix(in oklch, var(--accent) 12%, transparent);
      --accent-hover: color-mix(in oklch, var(--accent) 88%, black);
      --fg-soft:      color-mix(in oklch, var(--fg) 5%, transparent);

      --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;

      --fs-h1: 22px;  --fs-h2: 17px;  --fs-h3: 14px;
      --fs-body: 14px; --fs-meta: 12px;
      --radius-sm: 6px; --radius: 10px; --radius-lg: 14px; --radius-xl: 18px; --radius-pill: 999px;
      --gap-xs: 6px; --gap-sm: 10px; --gap-md: 16px; --gap-lg: 24px; --gap-xl: 36px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: var(--font-body); font-size: var(--fs-body);
      line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    h3 { margin: 0; }
    svg { display: block; }
    input { font: inherit; }

    /* ─── scrim (drawer) ─── */
    .scrim {
      position: fixed; inset: 0; z-index: 45;
      background: rgba(0,0,0,0.32); opacity: 0; pointer-events: none;
      transition: opacity 0.22s;
    }
    .scrim.on { opacity: 1; pointer-events: auto; }

    /* ─── sheet scrim (unified backdrop + panel) ─── */
    .sheet-scrim {
      position: fixed; inset: 0; z-index: 55;
      background: rgba(0,0,0,0.38); opacity: 0; pointer-events: none;
      transition: opacity 0.22s;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .sheet-scrim.on { opacity: 1; pointer-events: auto; }

    /* ═══════════════════════════════════════════════════════════════════
       TOP NAV TABS (desktop)
       ═══════════════════════════════════════════════════════════════════ */
    .top-tabs {
      display: none;
      gap: 2px; margin-left: 12px;
    }
    @media (min-width: 768px) {
      .top-tabs { display: flex; }
    }
    .top-tab {
      padding: 6px 14px; border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 500;
      color: var(--muted); transition: background 0.12s, color 0.12s;
      position: relative;
    }
    .top-tab:hover { background: var(--fg-soft); color: var(--fg); }
    .top-tab.active { color: var(--fg); font-weight: 600; }
    .top-tab.active::after {
      content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
      width: 18px; height: 2.5px; border-radius: 999px; background: var(--accent);
    }

    /* ═══════════════════════════════════════════════════════════════════
       NAVIGATION DRAWER (mobile)
       ═══════════════════════════════════════════════════════════════════ */
    .nav-drawer {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 50;
      width: 300px; max-width: 85vw;
      background: var(--surface);
      transform: translateX(-100%);
      transition: transform 0.26s cubic-bezier(0.32, 0.72, 0, 1);
      display: flex; flex-direction: column;
    }
    .nav-drawer.open { transform: translateX(0); }
    .drawer-header {
      display: flex; align-items: center; gap: 12px;
      padding: 18px 20px; border-bottom: 1px solid var(--border);
    }
    .drawer-header .drawer-logo {
      display: grid; place-items: center;
      width: 40px; height: 40px; border-radius: var(--radius);
      background: var(--accent); color: var(--surface); flex-shrink: 0;
    }
    .drawer-header .drawer-logo svg { width: 22px; height: 22px; }
    .drawer-header .drawer-brand {
      font-family: var(--font-display); font-size: 18px; font-weight: 620;
      letter-spacing: -0.015em;
    }
    .drawer-body { flex: 1; overflow-y: auto; padding: 12px 8px; }
    .drawer-section-label {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--muted);
      padding: 12px 16px 6px;
    }
    .drawer-item {
      display: flex; align-items: center; gap: 12px;
      width: 100%; padding: 12px 16px; border-radius: var(--radius-lg);
      font-size: 14px; font-weight: 500;
      color: var(--fg); transition: background 0.12s, color 0.12s;
    }
    .drawer-item:hover { background: var(--fg-soft); }
    .drawer-item.active { color: var(--accent); background: var(--accent-soft); }
    .drawer-item svg { width: 22px; height: 22px; flex-shrink: 0; }
    .drawer-item .drawer-badge {
      margin-left: auto; font-family: var(--font-mono); font-size: 12px;
      color: var(--muted); background: var(--fg-soft);
      padding: 2px 8px; border-radius: var(--radius-pill);
    }

    /* ═══════════════════════════════════════════════════════════════════
       APP SHELL
       ═══════════════════════════════════════════════════════════════════ */
    .app-shell {
      display: flex; flex-direction: column; min-height: 100vh;
    }

    /* ─── appbar ─── */
    .appbar {
      display: flex; align-items: center; gap: var(--gap-sm);
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      background: color-mix(in oklch, var(--surface) 94%, transparent);
      backdrop-filter: blur(14px); position: sticky; top: 0; z-index: 10;
    }
    @media (min-width: 768px) {
      .appbar { padding: 12px 24px; }
    }

    .hamburger {
      display: grid; place-items: center;
      width: 40px; height: 40px; border-radius: var(--radius-sm);
      color: var(--fg); flex-shrink: 0;
      transition: background 0.12s;
    }
    .hamburger:hover { background: var(--fg-soft); }
    .hamburger svg { width: 22px; height: 22px; }
    @media (min-width: 768px) {
      .hamburger { display: none; }
    }

    .appbar .brand {
      font-family: var(--font-display); font-size: var(--fs-h1);
      font-weight: 620; letter-spacing: -0.015em; white-space: nowrap;
    }
    .appbar .spacer { flex: 1; }

    .icon-btn {
      display: grid; place-items: center; width: 38px; height: 38px;
      border-radius: var(--radius-sm); color: var(--muted); flex-shrink: 0;
      transition: background 0.12s, color 0.12s;
    }
    .icon-btn:hover { background: var(--fg-soft); color: var(--fg); }
    .icon-btn svg { width: 20px; height: 20px; }

    /* ═══════════════════════════════════════════════════════════════════
       CONTENT
       ═══════════════════════════════════════════════════════════════════ */
    .content { padding: 14px 16px 100px; }
    @media (min-width: 768px) {
      .content { padding: 20px 24px 100px; }
    }

    /* ─── section header ─── */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: var(--gap-md);
    }
    .section-label {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--muted);
    }

    /* ─── empty state ─── */
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 64px 24px; color: var(--muted);
    }
    .empty-state svg { width: 56px; height: 56px; color: var(--border); margin-bottom: 16px; }
    .empty-state h3 { color: var(--fg); margin-bottom: 6px; }
    .empty-state p { max-width: 36ch; margin: 0 auto; font-size: var(--fs-body); margin-bottom: 24px; }
    .empty-state .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 10px 20px; border-radius: var(--radius);
      background: var(--accent); color: var(--surface);
      font-size: 14px; font-weight: 600;
      transition: background 0.12s;
    }
    .empty-state .btn:hover { background: var(--accent-hover); }
    .empty-state .btn svg { width: 16px; height: 16px; margin: 0; color: var(--surface); }

    /* ─── part kind card ─── */
    @media (min-width: 768px) {
      #part-cards {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: var(--gap-sm);
      }
    }
    @media (min-width: 1100px) {
      #part-cards {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    .part-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-xl); margin-bottom: var(--gap-sm);
      transition: border-color 0.14s;
    }
    @media (min-width: 768px) {
      .part-card { margin-bottom: 0; }
    }
    .part-card:hover { border-color: var(--accent-soft); }
    .part-card-inner {
      display: flex; align-items: center; gap: 14px; padding: 14px 18px;
    }
    .part-card .part-icon {
      display: grid; place-items: center;
      width: 40px; height: 40px; border-radius: var(--radius);
      background: var(--accent-soft); color: var(--accent); flex-shrink: 0;
    }
    .part-card .part-icon svg { width: 20px; height: 20px; }
    .part-card .part-info { flex: 1; min-width: 0; }
    .part-card .part-info .part-name {
      font-family: var(--font-display); font-size: var(--fs-h2);
      font-weight: 600; letter-spacing: -0.01em; margin-bottom: 2px;
    }
    .part-card .part-info .part-meta {
      font-family: var(--font-mono); font-size: 12px; color: var(--muted);
    }
    .part-card .more-btn {
      display: grid; place-items: center; width: 32px; height: 32px;
      border-radius: var(--radius-sm); color: var(--muted); flex-shrink: 0;
      transition: background 0.12s;
    }
    .part-card .more-btn:hover { background: var(--fg-soft); }
    .part-card .more-btn svg { width: 18px; height: 18px; }

    /* ═══════════════════════════════════════════════════════════════════
       FAB
       ═══════════════════════════════════════════════════════════════════ */
    .fab {
      position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px;
      background: var(--accent); color: var(--surface); border-radius: 16px;
      display: grid; place-items: center;
      box-shadow: 0 4px 18px rgba(0,0,0,0.13);
      transition: background 0.12s, transform 0.1s, box-shadow 0.12s;
      z-index: 30;
    }
    .fab:hover { background: var(--accent-hover); box-shadow: 0 6px 22px rgba(0,0,0,0.18); }
    .fab:active { transform: scale(0.96); }
    .fab svg { width: 24px; height: 24px; }
    @media (min-width: 768px) {
      .fab { display: none !important; }
    }
    .desktop-create-btn {
      display: none; align-items: center; gap: 6px;
      padding: 8px 18px; border-radius: var(--radius);
      background: var(--accent); color: var(--surface);
      font-size: 14px; font-weight: 600;
      transition: background 0.12s;
    }
    .desktop-create-btn:hover { background: var(--accent-hover); }
    @media (min-width: 768px) {
      .desktop-create-btn { display: inline-flex; }
    }

    /* ═══════════════════════════════════════════════════════════════════
        BOTTOM SHEET — create / edit part kind
        ═══════════════════════════════════════════════════════════════════ */
    .sheet-panel {
      width: 100%; max-height: 85vh; overflow-y: auto;
      background: var(--surface);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .sheet-scrim.on .sheet-panel {
      transform: translateY(0);
    }
    @media (min-width: 768px) {
      .sheet-scrim { align-items: center; }
      .sheet-panel {
        max-width: 480px; border-radius: var(--radius-xl);
        transform: translateY(16px) scale(0.94);
        opacity: 0;
        transition: transform 0.24s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.18s;
      }
      .sheet-scrim.on .sheet-panel {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .sheet-handle {
      display: flex; justify-content: center; padding: 10px 0 6px;
    }
    @media (min-width: 768px) {
      .sheet-handle { display: none; }
    }
    .sheet-handle::before {
      content: ''; width: 36px; height: 4px; border-radius: 999px;
      background: var(--border);
    }
    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 12px;
    }
    .sheet-header h2 {
      font-family: var(--font-display); font-size: 20px; font-weight: 620;
      letter-spacing: -0.01em; margin: 0;
    }
    .sheet-close {
      display: grid; place-items: center; width: 36px; height: 36px;
      border-radius: var(--radius-sm); color: var(--muted);
      transition: background 0.12s;
    }
    .sheet-close:hover { background: var(--fg-soft); }
    .sheet-close svg { width: 20px; height: 20px; }

    .sheet-body { padding: 0 20px 16px; }
    .sheet-body .field {
      margin-bottom: 0;
    }
    .sheet-body label {
      display: block; font-family: var(--font-mono); font-size: 11px;
      letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }
    .sheet-body input[type="text"] {
      width: 100%; padding: 12px 14px; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 15px;
      background: var(--surface); color: var(--fg);
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .sheet-body input[type="text"]:focus {
      border-color: var(--accent); box-shadow: 0 0 0 2.5px var(--accent-soft);
    }
    .sheet-body .char-count {
      text-align: right; font-size: 11px; color: var(--muted); margin-top: 4px;
    }

    .sheet-footer {
      display: flex; gap: var(--gap-sm); justify-content: flex-end;
      padding: 4px 20px 20px;
    }
    .btn-outline {
      padding: 12px 24px; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 14px; font-weight: 500;
      color: var(--fg); transition: background 0.12s;
    }
    .btn-outline:hover { background: var(--fg-soft); }
    .btn-filled {
      padding: 12px 28px; border-radius: var(--radius);
      background: var(--accent); color: var(--surface);
      font-size: 14px; font-weight: 600; transition: background 0.12s;
    }
    .btn-filled:hover { background: var(--accent-hover); }
    .btn-filled:disabled { opacity: 0.4; cursor: default; }

    /* ═══════════════════════════════════════════════════════════════════
       DIALOG — delete confirmation
       ═══════════════════════════════════════════════════════════════════ */
    .dialog-scrim {
      position: fixed; inset: 0; z-index: 75;
      background: rgba(0,0,0,0.32); opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .dialog-scrim.on { opacity: 1; pointer-events: auto; }

    .dialog-card {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.94);
      width: 90vw; max-width: 360px; z-index: 80;
      background: var(--surface); border-radius: var(--radius-xl);
      padding: 22px 20px; box-shadow: 0 12px 40px rgba(0,0,0,0.16);
      opacity: 0; pointer-events: none;
      transition: opacity 0.18s, transform 0.2s;
    }
    .dialog-card.on { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    .dialog-title {
      font-family: var(--font-display); font-size: var(--fs-h2); font-weight: 620;
      letter-spacing: -0.01em; margin-bottom: 6px;
    }
    .dialog-body { font-size: var(--fs-body); color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
    .dialog-actions { display: flex; gap: var(--gap-sm); justify-content: flex-end; }
    .btn-flat {
      padding: 9px 18px; border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 600; color: var(--muted);
      transition: background 0.12s, color 0.12s;
    }
    .btn-flat:hover { background: var(--fg-soft); color: var(--fg); }
    .btn-flat.danger {
      color: oklch(52% 0.22 25);
    }
    .btn-flat.danger:hover { background: oklch(93% 0.05 25); }

    /* ─── popover ─── */
    .popover {
      position: fixed; z-index: 70; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 6px 28px rgba(0,0,0,0.12);
      min-width: 160px; padding: 6px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.14s;
    }
    .popover.on { opacity: 1; pointer-events: auto; }
    .popover-item {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 10px 14px; border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 500; text-align: left;
      transition: background 0.1s;
    }
    .popover-item:hover { background: var(--fg-soft); }
    .popover-item.danger { color: oklch(52% 0.22 25); }
    .popover-item.danger:hover { background: oklch(93% 0.05 25); }
    .popover-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════════
      SCRIM (drawer)
      ═══════════════════════════════════════════════════════════════ -->
  <div class="scrim" id="scrim"></div>

  <!-- ═══════════════════════════════════════════════════════════════
     NAVIGATION DRAWER (mobile)
     ═══════════════════════════════════════════════════════════════ -->
  <nav class="nav-drawer" id="nav-drawer" role="dialog" aria-modal="true" aria-label="Navigation">
    <div class="drawer-header">
      <div class="drawer-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 20V4h20v16"/><path d="M12 4v16"/><path d="M2 10h20"/></svg>
      </div>
      <span class="drawer-brand">ScoutBox</span>
    </div>
    <div class="drawer-body">
      <div class="drawer-section-label">Inventaire</div>
      <button class="drawer-item" data-nav="tents">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 20V4h20v16"/><path d="M12 4v16"/><path d="M2 10h20"/></svg>
        Tentes
        <span class="drawer-badge">8</span>
      </button>
      <button class="drawer-item" data-nav="tags">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 2 4 9h8l-6.5 4.5 2.5 8-8-5.5-8 5.5 2.5-8L0 11h8Z"/></svg>
        Étiquettes
        <span class="drawer-badge">7</span>
      </button>
      <button class="drawer-item active" data-nav="parts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        Éléments
        <span class="drawer-badge" id="drawer-part-count">10</span>
      </button>
      <div class="drawer-section-label" style="margin-top:8px;">Compte</div>
      <button class="drawer-item" data-nav="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Réglages
      </button>
    </div>
  </nav>

  <!-- ═══════════════════════════════════════════════════════════════
     APP SHELL
     ═══════════════════════════════════════════════════════════════ -->
  <div class="app-shell">

    <!-- ── APPBAR ──────────────────────────────────────────────── -->
    <header class="appbar" data-od-id="appbar">
      <button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <span class="brand">Éléments</span>
      <div class="top-tabs">
        <button class="top-tab" data-nav="tents">Tentes</button>
        <button class="top-tab" data-nav="tags">Étiquettes</button>
        <button class="top-tab active" data-nav="parts">Éléments</button>
        <button class="top-tab" data-nav="settings">Réglages</button>
      </div>
      <span class="spacer"></span>
      <span style="font-family:var(--font-mono);font-size:12px;color:var(--muted);" id="part-count">10 éléments</span>
      <button class="desktop-create-btn" id="desktop-create-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:16px;height:16px;"><path d="M12 5v14M5 12h14"/></svg>
        Créer
      </button>
      <button class="icon-btn" title="Actualiser" id="refresh-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.5 15a9 9 0 0 0 14.1-2.5"/><path d="M23 20v-6h-6"/><path d="M20.5 9A9 9 0 0 0 6.4 11.5"/></svg>
      </button>
    </header>

    <!-- ── CONTENT ─────────────────────────────────────────────── -->
    <main class="content" data-od-id="part-list">
      <div id="part-cards"></div>
      <div class="empty-state" id="empty-state" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="width:56px;height:56px;color:var(--border);"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <h3>Aucun élément</h3>
        <p>Créez votre premier type d'élément pour pouvoir l'associer à vos tentes.</p>
        <button class="btn" id="empty-create">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Créer un élément
        </button>
      </div>
    </main>

    <!-- ── FAB ─────────────────────────────────────────────────── -->
    <button class="fab" id="fab" title="Créer un élément" aria-label="Créer un élément">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════
      BOTTOM SHEET — create / edit part kind
      ═══════════════════════════════════════════════════════════════ -->
  <div class="sheet-scrim" id="sheet-scrim">
    <div class="sheet-panel" id="part-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h2 id="sheet-title">Créer un élément</h2>
        <button class="sheet-close" id="sheet-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="sheet-body">
        <div class="field">
          <label for="part-name">Nom de l'élément</label>
          <input type="text" id="part-name" maxlength="60" placeholder="Ex: Toile extérieure, Arceaux, Maillet…" />
          <div class="char-count" id="char-count">0 / 60</div>
        </div>
      </div>
      <div class="sheet-footer">
        <button class="btn-outline" id="sheet-cancel">Annuler</button>
        <button class="btn-filled" id="sheet-confirm">Créer</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════
     DIALOG — delete confirmation
     ═══════════════════════════════════════════════════════════════ -->
  <div class="dialog-scrim" id="dialog-scrim"></div>
  <div class="dialog-card" id="delete-dialog" role="dialog" aria-modal="true">
    <div class="dialog-title">Supprimer l'élément</div>
    <div class="dialog-body" id="dialog-body">Cet élément sera retiré de toutes les tentes qui l'utilisent. Confirmer la suppression ?</div>
    <div class="dialog-actions">
      <button class="btn-flat" id="dialog-cancel">Annuler</button>
      <button class="btn-flat danger" id="dialog-confirm">Supprimer</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════
     POPOVER — more menu
     ═══════════════════════════════════════════════════════════════ -->
  <div class="popover" id="popover">
    <button class="popover-item" data-action="edit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
      Modifier
    </button>
    <button class="popover-item danger" data-action="delete">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      Supprimer
    </button>
  </div>

  <script>
    /* ═══════════════════════════════════════════════════════════════
       DATA
       ═══════════════════════════════════════════════════════════════ */
    const partKinds = [
      { id:'k1', name:'Toile extérieure',    tentCount:8 },
      { id:'k2', name:'Double-toit',         tentCount:6 },
      { id:'k3', name:'Arceaux',             tentCount:8 },
      { id:'k4', name:'Sardines',            tentCount:8 },
      { id:'k5', name:'Tapis de sol',        tentCount:5 },
      { id:'k6', name:'Haubans',             tentCount:7 },
      { id:'k7', name:'Sac de transport',    tentCount:8 },
      { id:'k8', name:'Piquets',             tentCount:4 },
      { id:'k9', name:'Maillet',             tentCount:3 },
      { id:'k10', name:'Kit de réparation',  tentCount:1 },
    ];

    /* ═══════════════════════════════════════════════════════════════
       RENDER PART CARDS
       ═══════════════════════════════════════════════════════════════ */
    function renderParts() {
      const container = document.getElementById('part-cards');
      const empty = document.getElementById('empty-state');
      const fab = document.getElementById('fab');
      const countEl = document.getElementById('part-count');
      const badge = document.getElementById('drawer-part-count');

      countEl.textContent = `${partKinds.length} élément${partKinds.length > 1 ? 's' : ''}`;
      badge.textContent = partKinds.length;

      if (!partKinds.length) {
        container.innerHTML = '';
        empty.style.display = 'flex';
        fab.style.display = 'none';
        return;
      }

      empty.style.display = 'none';
      fab.style.display = 'grid';

      container.innerHTML = partKinds.map(pk => `
        <div class="part-card">
          <div class="part-card-inner">
            <div class="part-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            </div>
            <div class="part-info">
              <div class="part-name">${pk.name}</div>
              <div class="part-meta">${pk.tentCount} tente${pk.tentCount > 1 ? 's' : ''}</div>
            </div>
            <button class="more-btn" data-part-id="${pk.id}" title="Plus d'options">
              <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
            </button>
          </div>
        </div>
      `).join('');
    }

    /* ═══════════════════════════════════════════════════════════════
       DRAWER & NAV
       ═══════════════════════════════════════════════════════════════ */
    const scrim = document.getElementById('scrim');
    const drawer = document.getElementById('nav-drawer');
    const hamburger = document.getElementById('hamburger');
    let drawerOpen = false;

    function openDrawer() {
      drawerOpen = true;
      drawer.classList.add('open');
      scrim.classList.add('on');
      hamburger.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
    }
    function closeDrawer() {
      drawerOpen = false;
      drawer.classList.remove('open');
      scrim.classList.remove('on');
      hamburger.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }

    hamburger.addEventListener('click', openDrawer);
    scrim.addEventListener('click', closeDrawer);

    document.querySelectorAll('.drawer-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.drawer-item, .top-tab').forEach(d => d.classList.toggle('active', d.dataset.nav === item.dataset.nav));
        closeDrawer();
      });
    });
    document.querySelectorAll('.top-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.drawer-item, .top-tab').forEach(d => d.classList.toggle('active', d.dataset.nav === tab.dataset.nav));
      });
    });

    /* ═══════════════════════════════════════════════════════════════
       SHEET — create / edit part kind
       ═══════════════════════════════════════════════════════════════ */
    const sheetScrim = document.getElementById('sheet-scrim');
    const partNameInput = document.getElementById('part-name');
    const charCount = document.getElementById('char-count');
    const sheetTitle = document.getElementById('sheet-title');
    const confirmBtn = document.getElementById('sheet-confirm');

    let editingPartId = null;
    let sheetOpen = false;

    function openSheet(partKind = null) {
      editingPartId = partKind ? partKind.id : null;
      sheetTitle.textContent = partKind ? 'Modifier l\'élément' : 'Créer un élément';
      confirmBtn.textContent = partKind ? 'Enregistrer' : 'Créer';
      partNameInput.value = partKind ? partKind.name : '';
      updateCharCount();
      sheetScrim.classList.add('on');
      sheetOpen = true;
      partNameInput.focus();
    }

    function closeSheet() {
      sheetScrim.classList.remove('on');
      sheetOpen = false;
      editingPartId = null;
    }

    sheetScrim.addEventListener('click', closeSheet);
    document.getElementById('sheet-close').addEventListener('click', closeSheet);
    document.getElementById('sheet-cancel').addEventListener('click', closeSheet);

    function updateCharCount() {
      charCount.textContent = `${partNameInput.value.length} / 60`;
    }

    partNameInput.addEventListener('input', updateCharCount);

    confirmBtn.addEventListener('click', () => {
      const name = partNameInput.value.trim();
      if (!name || name.length < 2) {
        partNameInput.focus();
        return;
      }

      if (editingPartId) {
        const idx = partKinds.findIndex(p => p.id === editingPartId);
        if (idx !== -1) {
          partKinds[idx].name = name;
        }
      } else {
        partKinds.push({
          id: 'k' + Date.now(),
          name: name,
          tentCount: 0,
        });
      }

      closeSheet();
      renderParts();
    });

    /* ═══════════════════════════════════════════════════════════════
       FAB & CREATE BUTTONS
       ═══════════════════════════════════════════════════════════════ */
    document.getElementById('fab').addEventListener('click', () => openSheet());
    document.getElementById('empty-create').addEventListener('click', () => openSheet());
    document.getElementById('desktop-create-btn').addEventListener('click', () => openSheet());

    /* ═══════════════════════════════════════════════════════════════
       DIALOG — delete confirmation
       ═══════════════════════════════════════════════════════════════ */
    const dialogScrim = document.getElementById('dialog-scrim');
    const dialogCard = document.getElementById('delete-dialog');
    const dialogBody = document.getElementById('dialog-body');
    let pendingDeleteId = null;

    function openDeleteDialog(partKind) {
      pendingDeleteId = partKind.id;
      dialogBody.textContent = partKind.tentCount > 0
        ? `« ${partKind.name} » est utilisé par ${partKind.tentCount} tente${partKind.tentCount > 1 ? 's' : ''}. Il sera retiré de toutes les tentes. Confirmer la suppression ?`
        : `Supprimer « ${partKind.name} » ? Cette action est irréversible.`;
      dialogScrim.classList.add('on');
      dialogCard.classList.add('on');
    }

    function closeDialog() {
      dialogScrim.classList.remove('on');
      dialogCard.classList.remove('on');
      pendingDeleteId = null;
    }

    document.getElementById('dialog-cancel').addEventListener('click', closeDialog);
    dialogScrim.addEventListener('click', closeDialog);

    document.getElementById('dialog-confirm').addEventListener('click', () => {
      if (!pendingDeleteId) return;
      const idx = partKinds.findIndex(p => p.id === pendingDeleteId);
      if (idx !== -1) partKinds.splice(idx, 1);
      renderParts();
      closeDialog();
    });

    /* ═══════════════════════════════════════════════════════════════
       POPOVER — more menu ⋮
       ═══════════════════════════════════════════════════════════════ */
    const popover = document.getElementById('popover');
    let popoverPartId = null;
    let popoverOpen = false;

    function openPopover(partId, anchor) {
      popoverPartId = partId;
      const rect = anchor.getBoundingClientRect();
      popover.style.top = `${rect.bottom + 4}px`;
      popover.style.right = `${window.innerWidth - rect.right}px`;
      popover.classList.add('on');
      popoverOpen = true;
    }

    function closePopover() {
      popover.classList.remove('on');
      popoverOpen = false;
      popoverPartId = null;
    }

    document.addEventListener('click', (e) => {
      const moreBtn = e.target.closest('.more-btn');
      if (moreBtn) {
        e.stopPropagation();
        if (popoverOpen && popoverPartId === moreBtn.dataset.partId) {
          closePopover();
        } else {
          openPopover(moreBtn.dataset.partId, moreBtn);
        }
        return;
      }

      if (popoverOpen && !popover.contains(e.target)) {
        closePopover();
      }
    });

    popover.addEventListener('click', (e) => {
      const item = e.target.closest('.popover-item');
      if (!item || !popoverPartId) return;

      const part = partKinds.find(p => p.id === popoverPartId);
      if (!part) return;

      if (item.dataset.action === 'edit') {
        closePopover();
        openSheet(part);
      } else if (item.dataset.action === 'delete') {
        closePopover();
        openDeleteDialog(part);
      }
    });

    /* ═══════════════════════════════════════════════════════════════
       ESCAPE KEY
       ═══════════════════════════════════════════════════════════════ */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (popoverOpen) closePopover();
        if (sheetOpen) closeSheet();
        if (pendingDeleteId) closeDialog();
        if (drawerOpen) closeDrawer();
      }
    });

    /* ═══════════════════════════════════════════════════════════════
       INIT
       ═══════════════════════════════════════════════════════════════ */
    renderParts();
  </script>
</body>
</html>
