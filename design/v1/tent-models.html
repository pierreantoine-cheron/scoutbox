<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScoutBox · Modèles de tente</title>
  <style>
    :root {
      --bg:      oklch(98.5% 0.002 240);
      --surface: oklch(100% 0 0);
      --fg:      oklch(20% 0.014 250);
      --muted:   oklch(52% 0.012 250);
      --border:  oklch(91% 0.006 250);
      --accent:  oklch(46% 0.13 145);

      --accent-soft:  color-mix(in oklch, var(--accent) 12%, transparent);
      --accent-hover: color-mix(in oklch, var(--accent) 88%, black);
      --fg-soft:      color-mix(in oklch, var(--fg) 5%, transparent);

      --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;

      --fs-h1: 22px;  --fs-h2: 17px;  --fs-h3: 14px;
      --fs-body: 14px; --fs-meta: 12px;
      --radius-sm: 6px; --radius: 10px; --radius-lg: 14px; --radius-xl: 18px; --radius-pill: 999px;
      --gap-xs: 6px; --gap-sm: 10px; --gap-md: 16px; --gap-lg: 24px; --gap-xl: 36px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: var(--font-body); font-size: var(--fs-body);
      line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    h3 { margin: 0; }
    svg { display: block; }
    input { font: inherit; }

    /* ─── scrim (drawer) ─── */
    .scrim {
      position: fixed; inset: 0; z-index: 45;
      background: rgba(0,0,0,0.32); opacity: 0; pointer-events: none;
      transition: opacity 0.22s;
    }
    .scrim.on { opacity: 1; pointer-events: auto; }

    /* ─── sheet scrim ─── */
    .sheet-scrim {
      position: fixed; inset: 0; z-index: 55;
      background: rgba(0,0,0,0.38); opacity: 0; pointer-events: none;
      transition: opacity 0.22s;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .sheet-scrim.on { opacity: 1; pointer-events: auto; }

    /* ═══════════════════════════════════════════════════════════════════
       TOP NAV TABS (desktop)
       ═══════════════════════════════════════════════════════════════════ */
    .top-tabs {
      display: none;
      gap: 2px; margin-left: 12px;
    }
    @media (min-width: 768px) {
      .top-tabs { display: flex; }
    }
    .top-tab {
      padding: 6px 14px; border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 500;
      color: var(--muted); transition: background 0.12s, color 0.12s;
      position: relative;
    }
    .top-tab:hover { background: var(--fg-soft); color: var(--fg); }
    .top-tab.active { color: var(--fg); font-weight: 600; }
    .top-tab.active::after {
      content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
      width: 18px; height: 2.5px; border-radius: 999px; background: var(--accent);
    }

    /* ═══════════════════════════════════════════════════════════════════
       NAVIGATION DRAWER (mobile)
       ═══════════════════════════════════════════════════════════════════ */
    .nav-drawer {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 50;
      width: 300px; max-width: 85vw;
      background: var(--surface);
      transform: translateX(-100%);
      transition: transform 0.26s cubic-bezier(0.32, 0.72, 0, 1);
      display: flex; flex-direction: column;
    }
    .nav-drawer.open { transform: translateX(0); }
    .drawer-header {
      display: flex; align-items: center; gap: 12px;
      padding: 18px 20px; border-bottom: 1px solid var(--border);
    }
    .drawer-header .drawer-logo {
      display: grid; place-items: center;
      width: 40px; height: 40px; border-radius: var(--radius);
      background: var(--accent); color: var(--surface); flex-shrink: 0;
    }
    .drawer-header .drawer-logo svg { width: 22px; height: 22px; }
    .drawer-header .drawer-brand {
      font-family: var(--font-display); font-size: 18px; font-weight: 620;
      letter-spacing: -0.015em;
    }
    .drawer-body { flex: 1; overflow-y: auto; padding: 12px 8px; }
    .drawer-section-label {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--muted);
      padding: 12px 16px 6px;
    }
    .drawer-item {
      display: flex; align-items: center; gap: 12px;
      width: 100%; padding: 12px 16px; border-radius: var(--radius-lg);
      font-size: 14px; font-weight: 500;
      color: var(--fg); transition: background 0.12s, color 0.12s;
    }
    .drawer-item:hover { background: var(--fg-soft); }
    .drawer-item.active { color: var(--accent); background: var(--accent-soft); }
    .drawer-item svg { width: 22px; height: 22px; flex-shrink: 0; }
    .drawer-item .drawer-badge {
      margin-left: auto; font-family: var(--font-mono); font-size: 12px;
      color: var(--muted); background: var(--fg-soft);
      padding: 2px 8px; border-radius: var(--radius-pill);
    }
    .drawer-footer {
      display: flex; flex-direction: column; gap: 2px;
      padding: 8px; border-top: 1px solid var(--border);
    }

    /* ═══════════════════════════════════════════════════════════════════
       APP SHELL
       ═══════════════════════════════════════════════════════════════════ */
    .app-shell {
      display: flex; flex-direction: column; min-height: 100vh;
    }

    /* ─── appbar ─── */
    .appbar {
      display: flex; align-items: center; gap: var(--gap-sm);
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      background: color-mix(in oklch, var(--surface) 94%, transparent);
      backdrop-filter: blur(14px); position: sticky; top: 0; z-index: 10;
    }
    @media (min-width: 768px) {
      .appbar { padding: 12px 24px; }
    }

    .hamburger {
      display: grid; place-items: center;
      width: 40px; height: 40px; border-radius: var(--radius-sm);
      color: var(--fg); flex-shrink: 0;
      transition: background 0.12s;
    }
    .hamburger:hover { background: var(--fg-soft); }
    .hamburger svg { width: 22px; height: 22px; }
    @media (min-width: 768px) {
      .hamburger { display: none; }
    }

    .appbar .brand {
      font-family: var(--font-display); font-size: var(--fs-h1);
      font-weight: 620; letter-spacing: -0.015em; white-space: nowrap;
    }
    .appbar .spacer { flex: 1; }

    .icon-btn {
      display: grid; place-items: center; width: 38px; height: 38px;
      border-radius: var(--radius-sm); color: var(--muted); flex-shrink: 0;
      transition: background 0.12s, color 0.12s;
    }
    .icon-btn:hover { background: var(--fg-soft); color: var(--fg); }
    .icon-btn svg { width: 20px; height: 20px; }

    /* ═══════════════════════════════════════════════════════════════════
       CONTENT
       ═══════════════════════════════════════════════════════════════════ */
    .content { padding: 14px 16px 100px; }
    @media (min-width: 768px) {
      .content { padding: 20px 24px 100px; }
    }

    /* ─── empty state ─── */
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 64px 24px; color: var(--muted);
    }
    .empty-state svg { width: 56px; height: 56px; color: var(--border); margin-bottom: 16px; }
    .empty-state h3 { color: var(--fg); margin-bottom: 6px; }
    .empty-state p { max-width: 36ch; margin: 0 auto; font-size: var(--fs-body); margin-bottom: 24px; }
    .empty-state .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 10px 20px; border-radius: var(--radius);
      background: var(--accent); color: var(--surface);
      font-size: 14px; font-weight: 600;
      transition: background 0.12s;
    }
    .empty-state .btn:hover { background: var(--accent-hover); }
    .empty-state .btn svg { width: 16px; height: 16px; margin: 0; color: var(--surface); }

    /* ═══════════════════════════════════════════════════════════════════
       MODEL CARDS
       ═══════════════════════════════════════════════════════════════════ */
    @media (min-width: 768px) {
      #model-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: var(--gap-sm);
        align-items: start;
      }
    }
    @media (min-width: 1100px) {
      #model-list {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .model-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-xl); margin-bottom: var(--gap-sm);
      transition: border-color 0.14s, box-shadow 0.2s;
      overflow: hidden;
    }
    @media (min-width: 768px) {
      .model-card { margin-bottom: 0; }
    }
    .model-card:hover { border-color: var(--accent-soft); }
    .model-card.expanded {
      border-color: var(--accent);
      box-shadow: 0 2px 16px color-mix(in oklch, var(--accent) 10%, transparent);
    }

    .model-card-header {
      display: flex; align-items: center; gap: 14px; padding: 14px 18px;
      cursor: pointer; user-select: none;
    }
    .model-icon {
      display: grid; place-items: center;
      width: 44px; height: 44px; border-radius: var(--radius);
      background: var(--accent-soft); color: var(--accent); flex-shrink: 0;
      transition: background 0.14s, color 0.14s;
    }
    .model-card.expanded .model-icon { background: var(--accent); color: var(--surface); }
    .model-icon svg { width: 22px; height: 22px; }
    .model-info { flex: 1; min-width: 0; }
    .model-info .model-name {
      font-family: var(--font-display); font-size: var(--fs-h2);
      font-weight: 600; letter-spacing: -0.01em; margin-bottom: 2px;
    }
    .model-info .model-meta {
      font-family: var(--font-mono); font-size: 12px; color: var(--muted);
    }
    .expand-indicator {
      display: grid; place-items: center; width: 28px; height: 28px;
      border-radius: var(--radius-sm); color: var(--muted); flex-shrink: 0;
      transition: transform 0.22s, color 0.14s;
    }
    .model-card.expanded .expand-indicator {
      transform: rotate(180deg); color: var(--accent);
    }
    .expand-indicator svg { width: 18px; height: 18px; }

    .more-btn {
      display: grid; place-items: center; width: 32px; height: 32px;
      border-radius: var(--radius-sm); color: var(--muted); flex-shrink: 0;
      transition: background 0.12s;
    }
    .more-btn:hover { background: var(--fg-soft); }
    .more-btn svg { width: 18px; height: 18px; }

    /* ─── expanded detail ─── */
    .model-detail {
      max-height: 0; overflow: hidden;
      transition: max-height 0.28s cubic-bezier(0.32, 0.72, 0, 1);
      border-top: 1px solid transparent;
    }
    .model-card.expanded .model-detail {
      max-height: 700px;
      border-top-color: var(--border);
    }
    .model-detail-inner { padding: 0 18px 16px; }

.detail-label {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-family: var(--font-mono);
  margin-top: 6px;
}


    /* ═══════════════════════════════════════════════════════════════════
       FAB
       ═══════════════════════════════════════════════════════════════════ */
    .fab {
      position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px;
      background: var(--accent); color: var(--surface); border-radius: 16px;
      display: grid; place-items: center;
      box-shadow: 0 4px 18px rgba(0,0,0,0.13);
      transition: background 0.12s, transform 0.1s, box-shadow 0.12s;
      z-index: 30;
    }
    .fab:hover { background: var(--accent-hover); box-shadow: 0 6px 22px rgba(0,0,0,0.18); }
    .fab:active { transform: scale(0.96); }
    .fab svg { width: 24px; height: 24px; }
    @media (min-width: 768px) {
      .fab { display: none !important; }
    }
    .desktop-create-btn {
      display: none; align-items: center; gap: 6px;
      padding: 8px 18px; border-radius: var(--radius);
      background: var(--accent); color: var(--surface);
      font-size: 14px; font-weight: 600;
      transition: background 0.12s;
    }
    .desktop-create-btn:hover { background: var(--accent-hover); }
    @media (min-width: 768px) {
      .desktop-create-btn { display: inline-flex; }
    }

    /* ═══════════════════════════════════════════════════════════════════
        BOTTOM SHEET — create / edit model
        ═══════════════════════════════════════════════════════════════════ */
    .sheet-panel {
      width: 100%; max-height: 85vh; overflow-y: auto;
      background: var(--surface);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .sheet-scrim.on .sheet-panel {
      transform: translateY(0);
    }
    @media (min-width: 768px) {
      .sheet-scrim { align-items: center; }
      .sheet-panel {
        max-width: 480px; border-radius: var(--radius-xl);
        transform: translateY(16px) scale(0.94);
        opacity: 0;
        transition: transform 0.24s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.18s;
      }
      .sheet-scrim.on .sheet-panel {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .sheet-handle {
      display: flex; justify-content: center; padding: 10px 0 6px;
    }
    @media (min-width: 768px) {
      .sheet-handle { display: none; }
    }
    .sheet-handle::before {
      content: ''; width: 36px; height: 4px; border-radius: 999px;
      background: var(--border);
    }
    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 12px;
    }
    .sheet-header h2 {
      font-family: var(--font-display); font-size: 20px; font-weight: 620;
      letter-spacing: -0.01em; margin: 0;
    }
    .sheet-close {
      display: grid; place-items: center; width: 36px; height: 36px;
      border-radius: var(--radius-sm); color: var(--muted);
      transition: background 0.12s;
    }
    .sheet-close:hover { background: var(--fg-soft); }
    .sheet-close svg { width: 20px; height: 20px; }

    .sheet-body { padding: 0 20px 16px; }
    .sheet-body label {
      display: block; font-family: var(--font-mono); font-size: 11px;
      letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }
    .sheet-body input[type="text"] {
      width: 100%; padding: 12px 14px; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 15px;
      background: var(--surface); color: var(--fg);
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .sheet-body input[type="text"]:focus {
      border-color: var(--accent); box-shadow: 0 0 0 2.5px var(--accent-soft);
    }
    .sheet-body .char-count {
      text-align: right; font-size: 11px; color: var(--muted); margin-top: 4px;
    }

    .sheet-footer {
      display: flex; gap: var(--gap-sm); justify-content: flex-end;
      padding: 4px 20px 20px;
    }
    .btn-outline {
      padding: 12px 24px; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 14px; font-weight: 500;
      color: var(--fg); transition: background 0.12s;
    }
    .btn-outline:hover { background: var(--fg-soft); }
    .btn-filled {
      padding: 12px 28px; border-radius: var(--radius);
      background: var(--accent); color: var(--surface);
      font-size: 14px; font-weight: 600; transition: background 0.12s;
    }
    .btn-filled:hover { background: var(--accent-hover); }
    .btn-filled:disabled { opacity: 0.4; cursor: default; }

    /* ═══════════════════════════════════════════════════════════════════
        ALL PARTS TOGGLE LIST (inline in expanded card)
        ═══════════════════════════════════════════════════════════════════ */
    .all-parts-list {
      display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px;
    }
    .toggle-part-row {
      display: flex; align-items: center; gap: 12px;
      width: 100%; padding: 10px 12px; border-radius: var(--radius);
      text-align: left; font-size: 14px; font-weight: 500;
      background: var(--bg); transition: background 0.12s, color 0.12s, transform 0.15s;
    }
    .toggle-part-row:hover { background: var(--fg-soft); }
    .toggle-part-row:active { transform: scale(0.985); }
    .toggle-part-row .part-check {
      display: grid; place-items: center; width: 22px; height: 22px; flex-shrink: 0;
      color: var(--border); transition: color 0.15s;
    }
    .toggle-part-row .part-check svg { width: 20px; height: 20px; }
    .toggle-part-row.assigned {
      background: var(--accent-soft); color: var(--accent);
    }
    .toggle-part-row.assigned .part-check { color: var(--accent); }
    .toggle-part-row .part-name { flex: 1; }

    /* ═══════════════════════════════════════════════════════════════════
        DIALOG — delete confirmation
        ═══════════════════════════════════════════════════════════════════ */
    .dialog-scrim {
      position: fixed; inset: 0; z-index: 75;
      background: rgba(0,0,0,0.32); opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .dialog-scrim.on { opacity: 1; pointer-events: auto; }

    .dialog-card {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.94);
      width: 90vw; max-width: 360px; z-index: 80;
      background: var(--surface); border-radius: var(--radius-xl);
      padding: 22px 20px; box-shadow: 0 12px 40px rgba(0,0,0,0.16);
      opacity: 0; pointer-events: none;
      transition: opacity 0.18s, transform 0.2s;
    }
    .dialog-card.on { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    .dialog-title {
      font-family: var(--font-display); font-size: var(--fs-h2); font-weight: 620;
      letter-spacing: -0.01em; margin-bottom: 6px;
    }
    .dialog-body { font-size: var(--fs-body); color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
    .dialog-actions { display: flex; gap: var(--gap-sm); justify-content: flex-end; }
    .btn-flat {
      padding: 9px 18px; border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 600; color: var(--muted);
      transition: background 0.12s, color 0.12s;
    }
    .btn-flat:hover { background: var(--fg-soft); color: var(--fg); }
    .btn-flat.danger {
      color: oklch(52% 0.22 25);
    }
    .btn-flat.danger:hover { background: oklch(93% 0.05 25); }

    /* ─── popover ─── */
    .popover {
      position: fixed; z-index: 70; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 6px 28px rgba(0,0,0,0.12);
      min-width: 160px; padding: 6px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.14s;
    }
    .popover.on { opacity: 1; pointer-events: auto; }
    .popover-item {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 10px 14px; border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 500; text-align: left;
      transition: background 0.1s;
    }
    .popover-item:hover { background: var(--fg-soft); }
    .popover-item.danger { color: oklch(52% 0.22 25); }
    .popover-item.danger:hover { background: oklch(93% 0.05 25); }
    .popover-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════════
      SCRIM (drawer)
      ═══════════════════════════════════════════════════════════════ -->
  <div class="scrim" id="scrim"></div>

  <!-- ═══════════════════════════════════════════════════════════════
     NAVIGATION DRAWER (mobile)
     ═══════════════════════════════════════════════════════════════ -->
  <nav class="nav-drawer" id="nav-drawer" role="dialog" aria-modal="true" aria-label="Navigation">
    <div class="drawer-header">
      <div class="drawer-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 20V4h20v16"/><path d="M12 4v16"/><path d="M2 10h20"/></svg>
      </div>
      <span class="drawer-brand">ScoutBox</span>
    </div>
    <div class="drawer-body">
      <button class="drawer-item" data-nav="tents">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 20V4h20v16"/><path d="M12 4v16"/><path d="M2 10h20"/></svg>
        Tentes
      </button>
      <button class="drawer-item" data-nav="tags">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m20.59 13.41-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
        Étiquettes
      </button>
      <button class="drawer-item" data-nav="parts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
        Éléments
      </button>
      <button class="drawer-item active" data-nav="models">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
        Modèles
        <span class="drawer-badge" id="drawer-model-count">3</span>
      </button>
    </div>
    <div class="drawer-footer">
      <button class="drawer-item" data-nav="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Réglages
      </button>
    </div>
  </nav>

  <!-- ═══════════════════════════════════════════════════════════════
     APP SHELL
     ═══════════════════════════════════════════════════════════════ -->
  <div class="app-shell">

    <!-- ── APPBAR ──────────────────────────────────────────────── -->
    <header class="appbar" data-od-id="appbar">
      <button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <span class="brand">Modèles de tente</span>
      <div class="top-tabs">
        <button class="top-tab" data-nav="tents">Tentes</button>
        <button class="top-tab" data-nav="tags">Étiquettes</button>
        <button class="top-tab" data-nav="parts">Éléments</button>
        <button class="top-tab active" data-nav="models">Modèles</button>
        <button class="top-tab" data-nav="settings">Réglages</button>
      </div>
      <span class="spacer"></span>
      <span style="font-family:var(--font-mono);font-size:12px;color:var(--muted);" id="model-count">3 modèles</span>
      <button class="desktop-create-btn" id="desktop-create-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:16px;height:16px;"><path d="M12 5v14M5 12h14"/></svg>
        Créer
      </button>
      <button class="icon-btn" title="Actualiser" id="refresh-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.5 15a9 9 0 0 0 14.1-2.5"/><path d="M23 20v-6h-6"/><path d="M20.5 9A9 9 0 0 0 6.4 11.5"/></svg>
      </button>
    </header>

    <!-- ── CONTENT ─────────────────────────────────────────────── -->
    <main class="content" data-od-id="model-list">
      <div id="model-list"></div>
      <div class="empty-state" id="empty-state" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="width:56px;height:56px;color:var(--border);"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
        <h3>Aucun modèle</h3>
        <p>Créez votre premier modèle de tente et associez-lui les éléments par défaut qui seront créés automatiquement.</p>
        <button class="btn" id="empty-create">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Créer un modèle
        </button>
      </div>
    </main>

    <!-- ── FAB ─────────────────────────────────────────────────── -->
    <button class="fab" id="fab" title="Créer un modèle" aria-label="Créer un modèle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════
      BOTTOM SHEET — create / edit model
      ═══════════════════════════════════════════════════════════════ -->
  <div class="sheet-scrim" id="model-sheet-scrim">
    <div class="sheet-panel" id="model-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h2 id="model-sheet-title">Créer un modèle</h2>
        <button class="sheet-close" id="model-sheet-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="sheet-body">
        <div class="field">
          <label for="model-name">Nom du modèle</label>
          <input type="text" id="model-name" maxlength="80" placeholder="Ex: Dôme, Tunnel, Canadienne…" />
          <div class="char-count" id="model-char-count">0 / 80</div>
        </div>
      </div>
      <div class="sheet-footer">
        <button class="btn-outline" id="model-sheet-cancel">Annuler</button>
        <button class="btn-filled" id="model-sheet-confirm">Créer</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════
       DIALOG — delete confirmation
      ═══════════════════════════════════════════════════════════════ -->
  <div class="dialog-scrim" id="dialog-scrim"></div>
  <div class="dialog-card" id="delete-dialog" role="dialog" aria-modal="true">
    <div class="dialog-title">Supprimer le modèle</div>
    <div class="dialog-body" id="dialog-body">Supprimer ce modèle ? Les tentes existantes qui l'utilisent ne seront pas affectées.</div>
    <div class="dialog-actions">
      <button class="btn-flat" id="dialog-cancel">Annuler</button>
      <button class="btn-flat danger" id="dialog-confirm">Supprimer</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════
     POPOVER — more menu
     ═══════════════════════════════════════════════════════════════ -->
  <div class="popover" id="popover">
    <button class="popover-item" data-action="edit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
      Modifier
    </button>
    <button class="popover-item danger" data-action="delete">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      Supprimer
    </button>
  </div>

  <script>
    /* ═══════════════════════════════════════════════════════════════
       DATA
       ═══════════════════════════════════════════════════════════════ */
    const partKinds = [
      { id:'k1', name:'Toile extérieure' },
      { id:'k2', name:'Double-toit' },
      { id:'k3', name:'Arceaux' },
      { id:'k4', name:'Sardines' },
      { id:'k5', name:'Tapis de sol' },
      { id:'k6', name:'Haubans' },
      { id:'k7', name:'Sac de transport' },
      { id:'k8', name:'Chambre intérieure' },
      { id:'k9', name:'Piquets' },
      { id:'k10', name:'Maillet' },
      { id:'k11', name:'Kit de réparation' },
    ];

    const models = [
      { id:'m1', name:'Dôme',            partKindIds:['k1','k2','k3','k4','k7'] },
      { id:'m2', name:'Tunnel',          partKindIds:['k1','k2','k3','k4','k6','k7'] },
      { id:'m3', name:'Canadienne',      partKindIds:['k1','k5','k7','k8'] },
      { id:'m4', name:'Tipi',            partKindIds:['k1','k3','k4','k5','k7'] },
      { id:'m5', name:'Gonflable',       partKindIds:['k1','k3','k4','k7','k11'] },
      { id:'m6', name:'Tente de toit',   partKindIds:['k1','k2','k5','k6','k7'] },
      { id:'m7', name:'Yourte',          partKindIds:['k1','k3','k4','k5','k7','k8','k9'] },
      { id:'m8', name:'Abri de camp',    partKindIds:['k1','k4','k6','k7','k9','k10'] },
    ];

    let expandedModelId = null;

    function getPartName(id) {
      const p = partKinds.find(pk => pk.id === id);
      return p ? p.name : id;
    }

    function modelPartCount(model) {
      return model.partKindIds.length;
    }

    /* ═══════════════════════════════════════════════════════════════
       RENDER MODEL LIST
       ═══════════════════════════════════════════════════════════════ */
    function renderModels() {
      const container = document.getElementById('model-list');
      const empty = document.getElementById('empty-state');
      const fab = document.getElementById('fab');
      const countEl = document.getElementById('model-count');
      const badge = document.getElementById('drawer-model-count');

      countEl.textContent = `${models.length} modèle${models.length > 1 ? 's' : ''}`;
      badge.textContent = models.length;

      if (!models.length) {
        container.innerHTML = '';
        empty.style.display = 'flex';
        fab.style.display = 'none';
        return;
      }

      empty.style.display = 'none';
      fab.style.display = 'grid';

      container.innerHTML = models.map(model => {
        const isExpanded = model.id === expandedModelId;
        const count = modelPartCount(model);
        return `
          <div class="model-card${isExpanded ? ' expanded' : ''}" id="card-${model.id}">
            <div class="model-card-header" data-model-id="${model.id}">
              <div class="model-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
              </div>
              <div class="model-info">
                <div class="model-name">${model.name}</div>
                <div class="model-meta">${count} élément${count > 1 ? 's' : ''} par défaut</div>
              </div>
              <button class="more-btn" data-model-id="${model.id}" title="Plus d'options">
                <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
              </button>
              <div class="expand-indicator">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
              </div>
            </div>
            <div class="model-detail">
              <div class="model-detail-inner">
                <div class="detail-label">Éléments</div>
                <div class="all-parts-list">
                  ${partKinds.map(pk => {
                    const isAssigned = model.partKindIds.includes(pk.id);
                    return `
                      <button class="toggle-part-row${isAssigned ? ' assigned' : ''}" data-model-id="${model.id}" data-part-id="${pk.id}">
                        <span class="part-check">${isAssigned
                          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>'
                          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/></svg>'
                        }</span>
                        <span class="part-name">${pk.name}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    /* ═══════════════════════════════════════════════════════════════
       DRAWER & NAV
       ═══════════════════════════════════════════════════════════════ */
    const scrim = document.getElementById('scrim');
    const drawer = document.getElementById('nav-drawer');
    const hamburger = document.getElementById('hamburger');
    let drawerOpen = false;

    function openDrawer() {
      drawerOpen = true;
      drawer.classList.add('open');
      scrim.classList.add('on');
      hamburger.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
    }
    function closeDrawer() {
      drawerOpen = false;
      drawer.classList.remove('open');
      scrim.classList.remove('on');
      hamburger.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }

    hamburger.addEventListener('click', openDrawer);
    scrim.addEventListener('click', closeDrawer);

    document.querySelectorAll('.drawer-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.drawer-item, .top-tab').forEach(d => d.classList.toggle('active', d.dataset.nav === item.dataset.nav));
        closeDrawer();
      });
    });
    document.querySelectorAll('.top-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.drawer-item, .top-tab').forEach(d => d.classList.toggle('active', d.dataset.nav === tab.dataset.nav));
      });
    });

    /* ═══════════════════════════════════════════════════════════════
       MODEL CARD EXPAND / COLLAPSE
       ═══════════════════════════════════════════════════════════════ */
    document.addEventListener('click', (e) => {
      if (e.target.closest('.more-btn')) return;
      const header = e.target.closest('.model-card-header');
      if (!header) return;

      const card = header.closest('.model-card');
      if (!card) return;

      const mid = header.dataset.modelId;
      const wasExpanded = card.classList.contains('expanded');

      // Collapse any currently expanded card
      const prevExpanded = document.querySelector('.model-card.expanded');
      if (prevExpanded) prevExpanded.classList.remove('expanded');

      if (!wasExpanded) {
        card.classList.add('expanded');
        expandedModelId = mid;
      } else {
        expandedModelId = null;
      }
    });

    /* ═══════════════════════════════════════════════════════════════
       TOGGLE PART — assign / unassign in expanded card
       ═══════════════════════════════════════════════════════════════ */
    function updateCardMeta(modelId) {
      const model = models.find(m => m.id === modelId);
      if (!model) return;
      const count = modelPartCount(model);
      const card = document.getElementById(`card-${modelId}`);
      if (card) {
        const meta = card.querySelector('.model-meta');
        if (meta) meta.textContent = `${count} élément${count > 1 ? 's' : ''} par défaut`;
      }
    }

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.toggle-part-row');
      if (!btn) return;
      e.stopPropagation();

      const modelId = btn.dataset.modelId;
      const partId = btn.dataset.partId;
      const model = models.find(m => m.id === modelId);
      if (!model) return;

      const idx = model.partKindIds.indexOf(partId);
      const checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>';
      const circleIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/></svg>';

      if (idx === -1) {
        model.partKindIds.push(partId);
        btn.classList.add('assigned');
        btn.querySelector('.part-check').innerHTML = checkIcon;
      } else {
        model.partKindIds.splice(idx, 1);
        btn.classList.remove('assigned');
        btn.querySelector('.part-check').innerHTML = circleIcon;
      }

      updateCardMeta(modelId);
    });

    /* ═══════════════════════════════════════════════════════════════
       MODEL SHEET — create / edit model
       ═══════════════════════════════════════════════════════════════ */
    const modelSheetScrim = document.getElementById('model-sheet-scrim');
    const modelNameInput = document.getElementById('model-name');
    const modelCharCount = document.getElementById('model-char-count');
    const modelSheetTitle = document.getElementById('model-sheet-title');
    const modelConfirmBtn = document.getElementById('model-sheet-confirm');

    let editingModelId = null;
    let modelSheetOpen = false;

    function openModelSheet(model = null) {
      editingModelId = model ? model.id : null;
      modelSheetTitle.textContent = model ? 'Modifier le modèle' : 'Créer un modèle';
      modelConfirmBtn.textContent = model ? 'Enregistrer' : 'Créer';
      modelNameInput.value = model ? model.name : '';
      updateModelCharCount();
      modelSheetScrim.classList.add('on');
      modelSheetOpen = true;
      modelNameInput.focus();
    }

    function closeModelSheet() {
      modelSheetScrim.classList.remove('on');
      modelSheetOpen = false;
      editingModelId = null;
    }

    modelSheetScrim.addEventListener('click', closeModelSheet);
    document.getElementById('model-sheet-close').addEventListener('click', closeModelSheet);
    document.getElementById('model-sheet-cancel').addEventListener('click', closeModelSheet);

    function updateModelCharCount() {
      modelCharCount.textContent = `${modelNameInput.value.length} / 80`;
    }
    modelNameInput.addEventListener('input', updateModelCharCount);

    modelConfirmBtn.addEventListener('click', () => {
      const name = modelNameInput.value.trim();
      if (!name || name.length < 2) {
        modelNameInput.focus();
        return;
      }

      if (editingModelId) {
        const idx = models.findIndex(m => m.id === editingModelId);
        if (idx !== -1) models[idx].name = name;
      } else {
        models.push({
          id: 'm' + Date.now(),
          name: name,
          partKindIds: [],
        });
      }

      closeModelSheet();
      renderModels();
    });

    /* ═══════════════════════════════════════════════════════════════
       FAB & CREATE BUTTONS
       ═══════════════════════════════════════════════════════════════ */
    document.getElementById('fab').addEventListener('click', () => openModelSheet());
    document.getElementById('empty-create').addEventListener('click', () => openModelSheet());
    document.getElementById('desktop-create-btn').addEventListener('click', () => openModelSheet());

    /* ═══════════════════════════════════════════════════════════════
       DIALOG — delete confirmation
       ═══════════════════════════════════════════════════════════════ */
    const dialogScrim = document.getElementById('dialog-scrim');
    const dialogCard = document.getElementById('delete-dialog');
    const dialogBody = document.getElementById('dialog-body');
    let pendingDeleteId = null;

    function openDeleteDialog(model) {
      pendingDeleteId = model.id;
      dialogBody.textContent = modelPartCount(model) > 0
        ? `« ${model.name} » définit ${modelPartCount(model)} élément${modelPartCount(model) > 1 ? 's' : ''} par défaut. Les tentes existantes ne seront pas affectées. Confirmer la suppression ?`
        : `Supprimer « ${model.name} » ? Cette action est irréversible.`;
      dialogScrim.classList.add('on');
      dialogCard.classList.add('on');
    }

    function closeDialog() {
      dialogScrim.classList.remove('on');
      dialogCard.classList.remove('on');
      pendingDeleteId = null;
    }

    document.getElementById('dialog-cancel').addEventListener('click', closeDialog);
    dialogScrim.addEventListener('click', closeDialog);

    document.getElementById('dialog-confirm').addEventListener('click', () => {
      if (!pendingDeleteId) return;
      const idx = models.findIndex(m => m.id === pendingDeleteId);
      if (idx !== -1) models.splice(idx, 1);
      if (expandedModelId === pendingDeleteId) expandedModelId = null;
      renderModels();
      closeDialog();
    });

    /* ═══════════════════════════════════════════════════════════════
       POPOVER — more menu ⋮
       ═══════════════════════════════════════════════════════════════ */
    const popover = document.getElementById('popover');
    let popoverModelId = null;
    let popoverOpen = false;

    function openPopover(modelId, anchor) {
      popoverModelId = modelId;
      const rect = anchor.getBoundingClientRect();
      popover.style.top = `${rect.bottom + 4}px`;
      popover.style.right = `${window.innerWidth - rect.right}px`;
      popover.classList.add('on');
      popoverOpen = true;
    }

    function closePopover() {
      popover.classList.remove('on');
      popoverOpen = false;
      popoverModelId = null;
    }

    document.addEventListener('click', (e) => {
      const moreBtn = e.target.closest('.more-btn');
      if (moreBtn && moreBtn.dataset.modelId) {
        e.stopPropagation();
        if (popoverOpen && popoverModelId === moreBtn.dataset.modelId) {
          closePopover();
        } else {
          openPopover(moreBtn.dataset.modelId, moreBtn);
        }
        return;
      }

      if (popoverOpen && !popover.contains(e.target)) {
        closePopover();
      }
    });

    popover.addEventListener('click', (e) => {
      const item = e.target.closest('.popover-item');
      if (!item || !popoverModelId) return;

      const model = models.find(m => m.id === popoverModelId);
      if (!model) return;

      if (item.dataset.action === 'edit') {
        closePopover();
        openModelSheet(model);
      } else if (item.dataset.action === 'delete') {
        closePopover();
        openDeleteDialog(model);
      }
    });

    /* ═══════════════════════════════════════════════════════════════
       ESCAPE KEY
       ═══════════════════════════════════════════════════════════════ */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (popoverOpen) closePopover();
        if (modelSheetOpen) closeModelSheet();
        if (pendingDeleteId) closeDialog();
        if (drawerOpen) closeDrawer();
      }
    });

    /* ═══════════════════════════════════════════════════════════════
       INIT
       ═══════════════════════════════════════════════════════════════ */
    renderModels();
  </script>
</body>
</html>
